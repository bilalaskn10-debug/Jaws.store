<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAWS.STORE | Pride of Hooligans</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; padding: 20px 15px; }
        .wrapper { width: 100%; max-width: 450px; margin: 0 auto; text-align: center; }
        
        .profile h1 { font-weight: 900; font-size: 30px; letter-spacing: -1.5px; text-transform: uppercase; margin-bottom: 5px; }
        .profile p { color: #888; font-size: 13px; margin-bottom: 30px; letter-spacing: 1px; }

        /* Grid Produk */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .card { 
            background: #111; border: 1px solid #222; border-radius: 18px; 
            padding: 12px; position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        
        .badge {
            position: absolute; top: 10px; left: 10px; background: #ff0000;
            color: #fff; font-size: 9px; font-weight: 800; padding: 4px 8px;
            border-radius: 5px; z-index: 2; text-transform: uppercase;
        }

        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; margin-bottom: 12px; }
        .price-tag { font-size: 12px; color: #ff0000; font-weight: 700; margin-bottom: 10px; display: block; }

        .btn-buy { 
            background: #ff0000; color: #fff; border: none; width: 100%; padding: 12px; 
            border-radius: 10px; font-weight: 800; font-size: 11px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2); transition: 0.3s;
        }
        .btn-buy:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); }

        .btn-full { 
            display: flex; align-items: center; justify-content: center; padding: 16px; 
            border-radius: 15px; text-decoration: none; font-weight: 700; font-size: 14px; 
            margin-bottom: 12px; color: #fff; transition: 0.3s;
        }
