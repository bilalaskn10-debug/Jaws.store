<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaws.Store | Linktree Hooligans</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px 15px; /* Padding lebih kecil agar muat */
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .profile h1 {
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .profile p {
            color: #888;
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* Grid Layout: Membuat 2 kolom bersebelahan */
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Membagi 2 kolom sama rata */
            gap: 12px; /* Jarak antar kotak */
            margin-bottom: 20px;
        }

        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img {
            width: 100%;
            aspect-ratio: 1 / 1; /* Membuat gambar kotak sempurna */
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .price-tag {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 8px;
        }

        /* Tombol Beli di Grid (Lebih Kecil) */
        .btn-buy {
            background-color: #ff0000;
            color: #fff !important;
            text-decoration: none;
            padding: 10px 5px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            transition: 0.3s;
        }

        /* Tombol Kontak (Tetap Lebar/Full) */
        .btn-full {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .btn-whatsapp { background-color: #25d366; color: #fff !important; }
        .btn-secondary { background-color: #1a1a1a; color: #fff !important; border: 1px solid #333; }

        .btn-buy:hover, .btn-full:hover {
            transform: scale(1.03);
            filter: brightness(1.2);
        }

        footer {
            margin-top: 30px;
            color: #444;
            font-size: 11px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="profile">
            <h1>🦈 JAWS.STORE</h1>
            <p>Jual beli flare & merchandise hooligans!</p>
        </div>

        <div class="product-grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=500&q=80" alt="Flare">
                <div>
                    <p style="font-size: 13px; font-weight: 600; margin-bottom: 2px;">Flare Sinyal</p>
                    <p class="price-tag">Rp 150k</p>
                    <a href="https://api.whatsapp.com/send?phone=6285893462034&text=Halo%20Jaws.Store%2C%20saya%20mau%20order%20Flare%20Sinyal" class="btn-buy">Beli Sekarang</a>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=500&q=80" alt="Merch">
                <div>
                    <p style="font-size: 13px; font-weight: 600; margin-bottom: 2px;">Merch Hooligan</p>
                    <p class="price-tag">Rp 100k</p>
                    <a href="https://api.whatsapp.com/send?phone=6285893462034&text=Halo%20Jaws.Store%2C%20saya%20mau%20order%20Merch%20Hooligans" class="btn-buy">Beli Sekarang</a>
                </div>
            </div>
        </div>

        <div style="margin-top: 10px;">
            <a href="https://api.whatsapp.com/send?phone=6285893462034&text=Halo%20Jaws.Store%2C%20saya%20mau%20tanya-tanya" class="btn-full btn-whatsapp">
                📞 Chat WhatsApp
            </a>
            <a href="https://instagram.com/jawsstore" class="btn-full btn-secondary">
                📸 Instagram
            </a>
        </div>

        <footer>
            &copy; 2025 JAWS.STORE
        </footer>
    </div>

</body>
</html>
