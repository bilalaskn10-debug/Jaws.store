<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaws.Store | Linktree Hooligans</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000000; color: #ffffff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; padding: 40px 20px; }
        .wrapper { width: 100%; max-width: 400px; text-align: center; }
        .profile h1 { font-weight: 800; font-size: 28px; letter-spacing: -1px; margin-bottom: 8px; text-transform: uppercase; }
        .profile p { color: #888; font-size: 14px; margin-bottom: 30px; }
        .card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 12px; margin-bottom: 20px; }
        .card img { width: 100%; height: 220px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; display: block; }
        .btn { display: flex; align-items: center; justify-content: center; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 15px; margin-bottom: 12px; transition: 0.3s; border: none; cursor: pointer; }
        .btn-primary { background-color: #ff0000; color: #ffffff; }
        .btn-primary:hover { background-color: #cc0000; transform: scale(1.02); }
        .btn-secondary { background-color: #1a1a1a; color: #ffffff; border: 1px solid #333; }
        .btn-whatsapp { background-color: #25d366; color: #ffffff; }
        .btn-whatsapp:hover { background-color: #20ba5a; transform: scale(1.02); }
        footer { margin-top: 40px; color: #444; font-size: 12px; }
        .icon { margin-right: 10px; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="profile">
            <h1>JAWS.STORE</h1>
            <p>Jual beli flare & merchandise hooligans!</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=500&q=80" alt="Flare Sinyal">
            <a href="https://wa.me/6285893462034?text=Halo%20Jaws.Store%2C%20saya%20mau%20order%20Flare%20Sinyal" class="btn btn-primary">
                <span class="icon">🛒</span> Beli Flare Sinyal (Rp 150k)
            </a>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=500&q=80" alt="Merchandise">
            <a href="https://wa.me/6285893462034?text=Halo%20Jaws.Store%2C%20saya%20mau%20order%20Merch%20Hooligans" class="btn btn-primary">
                <span class="icon">🛒</span> Beli Merch Hooligans (Rp 100k)
            </a>
        </div>

        <div style="margin-top: 30px;">
            <a href="https://wa.me/6285893462034" class="btn btn-whatsapp">
                <span class="icon">📞</span> Kontak WhatsApp
            </a>
            <a href="https://instagram.com/jawsstore" class="btn btn-secondary">
                <span class="icon">📸</span> Ikuti Instagram Kami
            </a>
        </div>

        <footer>
            &copy; 2025 JAWS.STORE
        </footer>
    </div>

</body>
</html>
